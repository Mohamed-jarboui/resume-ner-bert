name: Evaluate model

# Manual run: Actions > Evaluate model > Run workflow
on:
  push:
    branches: [main]
    paths: [".github/workflows/evaluate.yml", "scripts/evaluate.py"]
  workflow_dispatch:
    inputs:
      n:
        description: Number of generated test sentences
        default: "1000"

permissions:
  contents: write   # push the results branch

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # downloads the trained weights

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU)
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.44.2" "numpy<2" pytorch-crf seqeval scikit-learn pyyaml tqdm

      - name: Run evaluation
        run: |
          set -o pipefail
          mkdir -p results
          python scripts/evaluate.py --n ${{ inputs.n || '1000' }} | tee results/summary.txt

      - name: Show results
        run: |
          cat results/test_metrics.json
          echo "::notice title=metrics::$(python -c 'import json;print(json.dumps(json.load(open("results/test_metrics.json"))))')"
          {
            echo "## Evaluation results"
            sed -n '/| Entity/,$p' results/summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results/test_metrics.json

      - name: Push results to the 'results' branch
        run: |
          mkdir -p /tmp/out && cp results/test_metrics.json results/summary.txt /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan results
          git rm -rq --cached .
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -qm "Evaluation results (run ${{ github.run_id }})"
          git push -f origin results
